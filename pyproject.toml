[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-files-organize"
version = "0.2.1"
description = "Windows desktop tool for scanning, organizing and exporting WeChat media from Android phones."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=19,<20",
    "Pillow>=11.0",
    "PySide6-Essentials>=6.8.3,<6.10",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
wechat-files-organize = "wechat_media_exporter.app:main"

[tool.setuptools.packages.find]
include = ["wechat_media_exporter*"]

[tool.setuptools.package-data]
wechat_media_exporter = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

